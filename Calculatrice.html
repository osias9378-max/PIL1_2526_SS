    <script>
        console.log("appas;ni".split(';'))
        let calcul;
        let hist=[];
        console.log()
        function fact(n) {
             let resultat = 1;
             for (let i = 2; i <= n; i++) {
                 resultat *= i;
        }
        return resultat
        }
        function aide(){
            window.alert("x = variable (écris 7×x, pas 7x), | sépare plusieurs courbes, ; ajoute une condition (ex: x^2;x>=0|sin(x)), puis clique **tracer**.")
        }
        window.onload = function() {
             let selectMenu = document.querySelector('select');
             changerPage(selectMenu.value);
        }
        function changerPage(nomPage) {
              console.log("Fonction appelée avec :", nomPage);
              document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
              document.querySelector('.' + nomPage).classList.add('active');
        }
        function toggleFonctions() {
              let pageActive = document.querySelector('.page.active');
              let menu = pageActive.querySelector('.menu-flottant');
              menu.style.display = (menu.style.display === "none") ? "block" : "none";
       }
        let expressionCalcul="";
        let expressionCalculAfficher=""
        function ajouter(valeur) {
            if (calcul==1) {
                expressionCalcul=""
            }
             expressionCalcul += valeur;
             let pageActive = document.querySelector('.page.active');
             pageActive.querySelector('.affichage').textContent = formatAffichage(expressionCalcul);
             calcul=0;
        }
        

        function effacer() {
             expressionCalcul = "";
             let pageActive = document.querySelector('.page.active');
             pageActive.querySelector('.affichage').textContent = "";
        }
        let ecranf="";
        function calculer() {
             let resultat = eval(expressionCalcul);
             hist.push({expressionCalcul,resultat});
             let pageActive = document.querySelector('.page.active');
             pageActive.querySelector('.affichage').textContent = resultat;
             expressionCalcul = resultat.toString();
             calcul=1;
             hist.forEach(function ecran(hist){
                ecranf+=hist.expressionCalcul + "=" + hist.resultat + "<br>";
             })
        }
        function historique() {
              document.getElementById("ecran1").innerHTML = ecranf;
              let hecran = document.querySelector('.ecran1');
              ecran1.style.display = (ecran1.style.display === "none") ? "block" : "none";



        }

        let correspondances = {
             "Math.PI": "π",
             "Math.sqrt(": "√(",
             "Math.sin(": "sin(",
             "Math.cos(": "cos(",
             "Math.tan(": "tan(",
             "Math.log10(": "log(",
             "Math.log(": "ln(",
             "Math.asin(": "asin(",
             "Math.acos(": "acos(",
             "Math.sinh(": "sinh(",
             "Math.cosh(": "cosh(",
             "Math.tanh(": "tanh(",
             "<=": "≤",
             ">=": "≥",
             "**2": "²",
             "**": "^",
             "**-1": "^-1",
             "*10**": "×10^",
             "%": "mod",
             "*": "×",
             "/100": "%",
             "/": "÷",
             "Math.abs(": "|"
             
        };
        let myGraphe=null;
        function tracer(){
            let datasets=[];
            let xsGlobal=[];
            let couleurs = ['blue', 'red', 'green', 'orange','black','pink'];
            let courb=expressionCalcul.split('|');
            courb.forEach(function(ucourbe,index){
                let [exp,condition]=ucourbe.split(';');
                let {xs,ys}=point(exp,condition);
                xsGlobal=xs;
                datasets.push({label:exp,data:ys,borderColor:couleurs[index],fill:false,pointRadius:0,spanGaps:false})
                })

            let canvas = document.querySelector('.Graphes canvas');
            let ctx = canvas.getContext('2d');
            if (myGraphe!==null){
                myGraphe.destroy();
            }
            myGraphe = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: xsGlobal,
                    datasets: datasets
                },
                options: {
                    scales:{
                        x:{type :'linear'},
                    }
                }
            });

        }
        function formatAffichage(expr) {
             for (let cle in correspondances) {
                 expr = expr.replaceAll(cle, correspondances[cle]);
                }
             return expr;
        }
        function point(exp,condition,min=-60,max=60,pas=0.05){
            let xs=[];
            let ys=[];
            for (let x=min;x<=max;x+=pas){
                let resultat;
                let conditionValide;
                try{
                     resultat=eval(exp);
                     conditionValide=eval(condition);
                }catch(e){
                     resultat=null;
                     conditionValide=null;
                     window.alert("Erreur detecter!!!!!!!!1"+e.message);
                     break;
                }
                if(typeof resultat!=="number" || !isFinite(resultat) || conditionValide==false){
                     resultat=null;
                }
                xs.push(x);
                ys.push(resultat)
            }
            return{xs,ys}
        
        }
        function effacerun(){
            expressionCalcul=expressionCalcul.slice(0,-1);
            let pageActive = document.querySelector('.page.active');
            pageActive.querySelector('.affichage').textContent = formatAffichage(expressionCalcul);
        }

    </script>
