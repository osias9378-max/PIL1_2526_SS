<!DOCTYPE html>
<html>
<head>
    <title>Calculatrice</title>
    <style>
        .fond{
            background-color: rgb(18, 18, 50);
        }
        .clavier-basique{
            background-color: rgb(120, 117, 129);
            display: grid;
            grid-template-columns: repeat(5,1fr);
            gap: 8px;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 16px;
            width: 700px;

     
        }
        .clavier-avancer{
            background-color: rgb(120, 117, 129);
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 8px;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 16px;
            width: 700px;

        .egal{
            grid-column: span 2;
        }
        .page{
            display: none;
        }
        .page.active{

            flex-direction: column;
            align-items: center;

            padding-bottom: 10%;
        }
        .menu-flottant {
             position: absolute;
             background: #9c9c9d;
             border-radius: 8px;

        }
        .menu-flottant div {
             padding: 10px;
             color: rgb(90, 88, 88);
             cursor: pointer;
        }
        .menu-flottant div:hover {

        }

        .Tracer{
            margin-left: 90%;
        }
        
        .affichage{
            background-color: #c1c1c6;
            width: 700px;
            border-radius: 5px;
            padding: 12px;
            margin: 5px;
        }
        .clavier-Graphes{
            background-color: rgb(120, 117, 129);
            display: grid;
            grid-template-columns: repeat(5,1fr);
            gap: 8px;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px;

            width: 700px;
        }
        .Graphique{
            width: 700px;
            background-color: #c1c1c6;
        }
        
    </style>

        }

</head>

        <div class="Avance page"> 
             <div class="ecran">

            <br>
            <div class="clavier-avancer">
                    <button onclick="effacer()">AC</button>
                    <button onclick="ajouter('(')">(</button>
                    <button onclick="ajouter(')')">)</button>

                    <button onclick="ajouter('Math.PI')">π</button>
                    <button onclick="ajouter('**')">x^y</button>

                <div class="Courbe">

                <div class="clavier-Graphes">
                       <button onclick="effacer()">AC</button>
                       <button onclick="ajouter('(')">(</button>

    <script>
        console.log("appas;ni".split(';'))
        let calcul;
        console.log()
        function fact(n) {
             let resultat = 1;
             for (let i = 2; i <= n; i++) {
                 resultat *= i;
        }
        return resultat
        }

        window.onload = function() {
             let selectMenu = document.querySelector('select');
             changerPage(selectMenu.value);
        }
        function changerPage(nomPage) {
              console.log("Fonction appelée avec :", nomPage);
              document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
              document.querySelector('.' + nomPage).classList.add('active');
        }
        function toggleFonctions() {
              let pageActive = document.querySelector('.page.active');
              let menu = pageActive.querySelector('.menu-flottant');
              menu.style.display = (menu.style.display === "none") ? "block" : "none";
       }
        let expressionCalcul="";
        let expressionCalculAfficher=""
        function ajouter(valeur) {
            if (calcul==1) {
                expressionCalcul=""
            }
             expressionCalcul += valeur;
             let pageActive = document.querySelector('.page.active');
             pageActive.querySelector('.affichage').textContent = formatAffichage(expressionCalcul);
             calcul=0;
        }
        

        function effacer() {
             expressionCalcul = "";
             let pageActive = document.querySelector('.page.active');
             pageActive.querySelector('.affichage').textContent = "";
        }

        function calculer() {
             let resultat = eval(expressionCalcul);
             let pageActive = document.querySelector('.page.active');
             pageActive.querySelector('.affichage').textContent = resultat;
             expressionCalcul = resultat.toString();
             calcul=1;
        }

        let correspondances = {
             "Math.PI": "π",
             "Math.sqrt(": "√(",
             "Math.sin(": "sin(",
             "Math.cos(": "cos(",
             "Math.tan(": "tan(",
             "Math.log10(": "log(",
             "Math.log(": "ln(",
             "Math.asin(": "asin(",
             "Math.acos(": "acos(",
             "Math.sinh(": "sinh(",
             "Math.cosh(": "cosh(",
             "Math.tanh(": "tanh(",
             "<=": "≤",
             ">=": "≥",
             "**2": "²",
             "**": "^",
             "**-1": "^-1",
             "*10**": "×10^",
             "%": "mod",
             "*": "×",
             "/100": "%",
             "/": "÷",
             "Math.abs(": "|"
             
        };
        let myGraphe=null;
        function tracer(){
            let {xs,ys}=point(expressionCalcul);
            let canvas = document.querySelector('.Graphes canvas');
            let ctx = canvas.getContext('2d');
            if (myGraphe!==null){
                myGraphe.destroy();
            }

            myGraphe = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: xs,
                    datasets: [{
                        label: 'f(x)',
                        data: ys,
                        borderColor: 'blue',
                        fill: false,
                        pointRadius: 0
                    }]
                },
                options: {
                    scales:{
                        x:{type :'linear'}
                    }
                }
            });
        }
        function formatAffichage(expr) {
             for (let cle in correspondances) {
                 expr = expr.replaceAll(cle, correspondances[cle]);
                }
             return expr;
        }
        function point(expressionCalcul,min=-20,max=20,pas=0.01){
            let xs=[];
            let ys=[];
            for (let x=min;x<=max;x+=pas){
                let resultat;
                try{
                     resultat=eval(expressionCalcul);
                }catch(e){
                     resultat=null;
                     window.alert("Erreur detecter!!!!!!!!1"+e.message);
                     break;
                }
                if(typeof resultat!=="number" || !isFinite(resultat)){
                     resultat=null;
                }
                xs.push(x);
                ys.push(resultat)
            }
            return{xs,ys}
        }
        function effacerun(){
            expressionCalcul=expressionCalcul.slice(0,-1);
            let pageActive = document.querySelector('.page.active');
            pageActive.querySelector('.affichage').textContent = formatAffichage(expressionCalcul);
        }

        


    </script>
</body>
</html>
